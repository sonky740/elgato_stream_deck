<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      sdpi-components 는 CDN 이 아니라 vendor/ 에 로컬로 둔다. Elgato 가 CDN 을 비권장하고,
      이 저장소는 self-contained 배포를 지킨다. vendor/ 아래에 두면 루트 eslint·prettier 가
      이미 무시하므로 보호된 설정 파일을 건드릴 필요도 없다.
    -->
    <script src="../vendor/sdpi-components.js"></script>
    <!--
      문구 테이블. sdpi-components 뒤 · <body> 앞에서 동기 로드해야 한다 — 커스텀 엘리먼트가
      업그레이드될 때 locales 가 이미 있어야 `__MSG_…__` 가 치환된다.
    -->
    <script src="i18n.js"></script>
    <!-- 버튼 클릭 → `sendToPlugin`. i18n.js 와 같은 DOMContentLoaded 에 붙는다(순서 무관). -->
    <script src="commands.js"></script>
    <style>
      /*
        sdpi-components 의 색 토큰은 각 컴포넌트의 :host 에만 선언돼 있어(--font-color 등)
        컴포넌트 밖 요소는 상속받지 못한다. 그래서 도움말 블록은 같은 팔레트 값을 직접 쓴다.
        기본 상속 색으로 두면 어두운 배경에서 거의 안 보인다.
      */
      body {
        font-family: 'Segoe UI', Arial, Roboto, Helvetica, sans-serif;
      }
      .help {
        margin: 10px 0 4px;
        border-top: 1px solid #3d3d3d;
        padding-top: 6px;
      }
      .help > summary {
        color: #b4b4b4;
        font-size: 11px;
        cursor: pointer;
        padding: 2px 0;
        user-select: none;
      }
      .help p {
        color: #c8c8c8;
        font-size: 11px;
        line-height: 1.65;
        margin: 6px 2px 2px;
      }
      .help b {
        color: #ececec;
      }
    </style>
  </head>
  <body>
    <sdpi-item label="__MSG_chart__">
      <sdpi-radio
        setting="chart"
        default="donut"
        columns="2"
      >
        <option value="donut">__MSG_donut__</option>
        <option value="bar">__MSG_bar__</option>
      </sdpi-radio>
    </sdpi-item>

    <sdpi-item label="__MSG_basis__">
      <sdpi-radio
        setting="basis"
        default="used"
        columns="2"
      >
        <option value="used">__MSG_used__</option>
        <option value="remaining">__MSG_remaining__</option>
      </sdpi-radio>
    </sdpi-item>

    <!--
      임계값은 인스턴스별이다 — 폴링 간격과 달리 프로바이더 공유 자원이 아니라 판독 정책이라,
      Codex 주간만 더 일찍 경고하는 식으로 액션마다 다르게 둘 수 있다.
      두 드롭다운은 서로를 모르므로 뒤집힌 조합을 고를 수 있다 — resolveThresholds() 가
      warnAt 을 critAt 까지 끌어내린다(도움말에 그렇게 적었다).
      value-type 기본값이 'string' 이므로 숫자 설정엔 반드시 명시한다.
    -->
    <sdpi-item label="__MSG_warnAt__">
      <sdpi-select
        setting="warnAt"
        value-type="number"
        default="80"
      >
        <option value="50">50%</option>
        <option value="60">60%</option>
        <option value="70">70%</option>
        <option value="75">75%</option>
        <option value="80">__MSG_pct80Recommended__</option>
        <option value="85">85%</option>
        <option value="90">90%</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item label="__MSG_critAt__">
      <sdpi-select
        setting="critAt"
        value-type="number"
        default="95"
      >
        <option value="80">80%</option>
        <option value="85">85%</option>
        <option value="90">90%</option>
        <option value="95">__MSG_pct95Recommended__</option>
        <option value="99">99%</option>
        <option value="100">100%</option>
      </sdpi-select>
    </sdpi-item>

    <!--
      갱신 주기는 전역이다 — 프로바이더 공유 자원이라 인스턴스마다 다르면 요청률이 곱해진다.
      슬라이더(sdpi-range)를 쓰지 않는 이유: 현재값 표시 기능이 없어(min/max 만 보인다) 무엇으로
      설정돼 있는지 알 수 없고, 폴링 간격에 초 단위 연속 자유도는 필요하지도 않다.
      value-type 기본값이 'string' 이므로 숫자 설정엔 반드시 명시한다.
    -->
    <sdpi-item label="__MSG_pollInterval__">
      <sdpi-select
        setting="pollIntervalSec"
        global
        value-type="number"
        default="300"
      >
        <option value="60">__MSG_min1__</option>
        <option value="180">__MSG_min3__</option>
        <option value="300">__MSG_min5Recommended__</option>
        <option value="600">__MSG_min10__</option>
        <option value="1800">__MSG_min30__</option>
        <option value="3600">__MSG_hour1__</option>
      </sdpi-select>
    </sdpi-item>

    <!--
      수동 새로고침. 설정이 아니라 명령이라 `setting` 이 없고, 클릭 전송은 ui/commands.js 가
      맡는다(sdpi-button 은 아무것도 전송하지 않는다). 요청은 마지막 시도 기준 최소 1분 간격이고
      실패 백오프를 앞당기지 못한다 — 도움말에 그렇게 적었다.
    -->
    <sdpi-item>
      <sdpi-button
        data-send="refresh"
        data-i18n="refreshNow"
      ></sdpi-button>
    </sdpi-item>

    <!-- 도움말은 sdpi 컴포넌트가 아니라 `__MSG_` 가 닿지 않는다 — ui/i18n.js 가 채운다. -->
    <details class="help">
      <summary data-i18n="help"></summary>
      <p data-i18n="helpThresholds"></p>
      <p data-i18n="helpRefresh"></p>
      <p data-i18n="helpSourceClaude"></p>
      <p data-i18n="helpLoginClaude"></p>
      <p data-i18n="helpBlank"></p>
    </details>
  </body>
</html>
