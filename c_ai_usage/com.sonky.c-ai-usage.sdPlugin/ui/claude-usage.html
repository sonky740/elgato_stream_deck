<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      sdpi-components 는 CDN 이 아니라 vendor/ 에 로컬로 둔다. Elgato 가 CDN 을 비권장하고,
      이 저장소는 self-contained 배포를 지킨다. vendor/ 아래에 두면 루트 eslint·prettier 가
      이미 무시하므로 보호된 설정 파일을 건드릴 필요도 없다.
    -->
    <script src="../vendor/sdpi-components.js"></script>
    <style>
      /*
        sdpi-components 의 색 토큰은 각 컴포넌트의 :host 에만 선언돼 있어(--font-color 등)
        컴포넌트 밖 요소는 상속받지 못한다. 그래서 도움말 블록은 같은 팔레트 값을 직접 쓴다.
        기본 상속 색으로 두면 어두운 배경에서 거의 안 보인다.
      */
      body {
        font-family: 'Segoe UI', Arial, Roboto, Helvetica, sans-serif;
      }
      .help {
        margin: 10px 0 4px;
        border-top: 1px solid #3d3d3d;
        padding-top: 6px;
      }
      .help > summary {
        color: #b4b4b4;
        font-size: 11px;
        cursor: pointer;
        padding: 2px 0;
        user-select: none;
      }
      .help p {
        color: #c8c8c8;
        font-size: 11px;
        line-height: 1.65;
        margin: 6px 2px 2px;
      }
      .help b {
        color: #ececec;
      }
    </style>
  </head>
  <body>
    <sdpi-item label="차트">
      <sdpi-radio
        setting="chart"
        default="donut"
        columns="2"
      >
        <option value="donut">도넛</option>
        <option value="bar">가로 바</option>
      </sdpi-radio>
    </sdpi-item>

    <sdpi-item label="표시 기준">
      <sdpi-radio
        setting="basis"
        default="used"
        columns="2"
      >
        <option value="used">사용량</option>
        <option value="remaining">남은양</option>
      </sdpi-radio>
    </sdpi-item>

    <!--
      갱신 주기는 전역이다 — 프로바이더 공유 자원이라 인스턴스마다 다르면 요청률이 곱해진다.
      슬라이더(sdpi-range)를 쓰지 않는 이유: 현재값 표시 기능이 없어(min/max 만 보인다) 무엇으로
      설정돼 있는지 알 수 없고, 폴링 간격에 초 단위 연속 자유도는 필요하지도 않다.
      value-type 기본값이 'string' 이므로 숫자 설정엔 반드시 명시한다.
    -->
    <sdpi-item label="갱신 주기">
      <sdpi-select
        setting="pollIntervalSec"
        global
        value-type="number"
        default="300"
      >
        <option value="60">1분</option>
        <option value="180">3분</option>
        <option value="300">5분 (권장)</option>
        <option value="600">10분</option>
        <option value="1800">30분</option>
        <option value="3600">1시간</option>
      </sdpi-select>
    </sdpi-item>

    <details class="help">
      <summary>도움말</summary>
      <p>
        수치는 <b>Claude 계정에서 직접</b> 읽어옵니다 — 기기별 로컬 기록이 아니라 계정 전체
        사용량이므로 여러 기기에서 쓴 양이 합산됩니다.
      </p>
      <p>
        이 기기에 <b>Claude Code 로그인</b>이 필요합니다. <b>재로그인 필요</b>가 보이면 Claude Code
        를 한 번 실행하면 자동으로 복구됩니다.
      </p>
      <p>빈 칸(<b>—</b>)은 0% 가 아니라 <b>값을 모른다</b>는 뜻입니다.</p>
    </details>
  </body>
</html>
