<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      sdpi-components 는 CDN 이 아니라 vendor/ 에 로컬로 둔다. Elgato 가 CDN 을 비권장하고,
      이 저장소는 self-contained 배포를 지킨다. vendor/ 아래에 두면 루트 eslint·prettier 가
      이미 무시하므로 보호된 설정 파일을 건드릴 필요도 없다.
    -->
    <script src="../vendor/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="차트">
      <sdpi-radio
        setting="chart"
        default="donut"
        columns="2"
      >
        <option value="donut">도넛</option>
        <option value="bar">가로 바</option>
      </sdpi-radio>
    </sdpi-item>

    <sdpi-item label="표시 기준">
      <sdpi-radio
        setting="basis"
        default="used"
        columns="2"
      >
        <option value="used">사용량</option>
        <option value="remaining">남은양</option>
      </sdpi-radio>
    </sdpi-item>

    <!--
      갱신 주기는 전역이다 — 프로바이더 공유 자원이라 인스턴스마다 다르면 요청률이 곱해진다.
      value-type 기본값이 'string' 이므로 숫자 설정엔 반드시 명시한다.
      하한 60 은 실측 근거가 있는 값이고, 그보다 짧게 열면 레이트리밋 사고를 재현할 수 있다.
    -->
    <sdpi-item label="갱신 주기">
      <sdpi-range
        setting="pollIntervalSec"
        global
        value-type="number"
        min="60"
        max="3600"
        step="60"
        default="300"
        showlabels
      ></sdpi-range>
    </sdpi-item>

    <!-- sdpi-item-group 은 v4.0.1 에 없다(커스텀 엘리먼트 등록 목록으로 확인). 평범한 마크업을 쓴다. -->
    <details>
      <summary style="font-size: 11px; margin: 8px">도움말</summary>
      <p style="margin: 4px 8px; font-size: 11px; line-height: 1.5">
        수치는 ChatGPT 계정에서 직접 읽어옵니다 — 기기별 로컬 기록이 아니라 계정 전체 사용량입니다.
        이 기기에 Codex CLI 로그인이 필요합니다. "재로그인 필요" 가 보이면 codex 를 한 번
        실행하세요.
      </p>
      <p style="margin: 4px 8px; font-size: 11px; line-height: 1.5; color: #999">
        OpenAI 가 2026-07-13 이후 주간 창만 반환하므로 <b>5HR 칸이 비어 있는 것이 정상</b>입니다. 빈
        칸은 0% 가 아니라 "모름"으로 표시됩니다. 5시간 창이 돌아오면 자동으로 채워집니다.
      </p>
    </details>
  </body>
</html>
